[project]
name = "northpoint-mock"
version = "0.1.0"
description = "Northpoint stress-echo readiness mock (SYNTHETIC – MOCK DATA)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "pypdfium2==4.30.0",   # page PNGs; poppler/pdftoppm is not installed on this machine
    "reportlab>=4.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
